<text x="332" y="310" font-size="20" fill="#28352f" font-weight="700">Цвет ауры зависит от эффекта.</text>
<text x="332" y="337" font-size="16.5" fill="#28352f">Область поддержки — окружность вокруг фигуры.</text>
<circle cx="340" cy="363" r="8" fill="#c96060"/><text x="356" y="369" font-size="16" fill="#28352f">Атака</text>
