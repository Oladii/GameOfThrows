<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">Что показывают кнопки «Атаки» и «Ауры»</title>
<desc id="desc">Две схемы подсказок игрового поля. Атаки показывают зоны и отдельный суммарный урон каждой команды. Ауры показаны окружностями: атака красная, защита синяя, совмещённая аура фиолетовая.</desc>
