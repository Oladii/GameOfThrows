<text x="332" y="161" font-size="18" fill="#28352f" font-weight="400" >Синий — Север, оранжевый — Юг.</text>
<text x="332" y="187" font-size="18" fill="#28352f" font-weight="400" >В кружках — суммарный урон каждой команды.</text>
<text x="332" y="221" font-size="18" fill="#28352f" font-weight="400" >Два кружка — клетку атакуют обе команды.</text>
