<circle cx="620" cy="363" r="8" fill="#9770be"/><text x="636" y="369" font-size="16" fill="#28352f">Атака и защита</text>
<text x="332" y="397" font-size="16.5" fill="#28352f">Цвета одинаковы для обеих команд.</text>
<text x="332" y="421" font-size="16.5" fill="#28352f">Заливка пульсирует 5–25%, контур — 25%.</text>
<text x="32" y="459" font-size="13.5" fill="#7d8278" font-weight="400" >Повторное нажатие выключает режим. Выбор фигуры завершает общий просмотр.</text>
