<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc" font-family="Arial,sans-serif"><title id="title">Подсказки на поле</title><desc id="desc">Доступный ход, прогноз перемещения, источники урона и череп гибели.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bd8b33"/></marker></defs><rect width="960" height="650" rx="18" fill="#f5f3ed"/><text x="24" y="36" font-size="25" font-weight="700" fill="#28352f">Обозначения на поле</text>
<rect x="20" y="60" width="445" height="245" rx="15" fill="#fffefb" stroke="#e4e3d9"/><text x="42" y="95" font-size="21" font-weight="700" fill="#28352f">Доступный ход</text><polygon points="160.03332099679082,153 160.03332099679082,205 115,231 69.96667900320918,205 69.9666790032092,153 114.99999999999999,127" fill="#dfeacf" stroke="#96af82" stroke-width="2"/><circle cx="115" cy="179" r="6" fill="#92ab7d"/><text x="202" y="144" font-size="17" fill="#536158"><tspan x="202" dy="0">Зелёная пустая клетка:</tspan><tspan x="202" dy="25">сюда можно передвинуть</tspan><tspan x="202" dy="25">выбранную фигуру.</tspan></text>
<rect x="495" y="60" width="445" height="245" rx="15" fill="#fffefb" stroke="#e4e3d9"/><text x="517" y="95" font-size="21" font-weight="700" fill="#28352f">Прогноз при наведении</text><polygon points="591.6410161513776,155 591.6410161513776,195 557,215 522.3589838486224,195 522.3589838486224,155 557,135" fill="#eeeee5" stroke="#d8dacb" stroke-width="2"/><polygon points="665.6410161513776,155 665.6410161513776,195 631,215 596.3589838486224,195 596.3589838486224,155 631,135" fill="#dfeacf" stroke="#96af82" stroke-width="2"/><g transform="translate(557,175)" opacity="0.28"><circle r="25" fill="#3e607c" stroke="#fffdf7" stroke-width="3"/><g transform="translate(-12,-13)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 20 5v6c0 5-4 8-8 11-4-3-8-6-8-11V5Z M12 6v11M8 10h8"/></g></g><g transform="translate(631,175)" opacity="0.6"><circle r="25" fill="#517867" stroke="#fffdf7" stroke-width="3"/><g transform="translate(-12,-13)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 20 5v6c0 5-4 8-8 11-4-3-8-6-8-11V5Z M12 6v11M8 10h8"/></g></g><circle cx="624" cy="150" r="9" fill="#f8edcb" stroke="#b8a16b"/><text x="624" y="154" font-size="12" font-weight="700" text-anchor="middle" fill="#28352f">4</text><circle cx="638" cy="150" r="9" fill="#e5eedf" stroke="#9eaf94"/><text x="638" y="154" font-size="12" font-weight="700" text-anchor="middle" fill="#28352f">1</text><circle cx="611" cy="195" r="9" fill="#fce1d7" stroke="#c4735c"/><text x="611" y="199" font-size="12" font-weight="700" text-anchor="middle" fill="#28352f">2</text><circle cx="651" cy="195" r="9" fill="#fffdf7" stroke="#d8ddcf"/><text x="651" y="199" font-size="12" font-weight="700" text-anchor="middle" fill="#28352f">3</text><text x="695" y="132" font-size="17" fill="#536158"><tspan x="695" dy="0">Наведи на доступную клетку.</tspan><tspan x="695" dy="25">Бледная фишка — откуда</tspan><tspan x="695" dy="25">идёшь. Новая позиция</tspan><tspan x="695" dy="25">показывает результат хода.</tspan></text>
<rect x="20" y="325" width="445" height="245" rx="15" fill="#fffefb" stroke="#e4e3d9"/><text x="42" y="360" font-size="21" font-weight="700" fill="#28352f">Кто наносит урон</text><polygon points="120.64101615137756,422 120.64101615137756,462 86,482 51.35898384862245,462 51.35898384862246,422 85.99999999999999,402" fill="#eeeee5" stroke="#d8dacb" stroke-width="2"/><polygon points="198.64101615137756,422 198.64101615137756,462 164,482 129.35898384862244,462 129.35898384862247,422 164,402" fill="#eeeee5" stroke="#d8dacb" stroke-width="2"/><g transform="translate(86,442)" opacity="1"><circle r="25" fill="#3e607c" stroke="#fffdf7" stroke-width="3"/><g transform="translate(-12,-13)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3c10 4 10 14 0 18L12 12Z M3 12h18m-4-3 4 3-4 3"/></g></g><g transform="translate(164,442)" opacity="1"><circle r="25" fill="#af6a4b" stroke="#fffdf7" stroke-width="3"/><g transform="translate(-12,-13)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 20 5v6c0 5-4 8-8 11-4-3-8-6-8-11V5Z M12 6v11M8 10h8"/></g></g><circle cx="86" cy="442" r="28" fill="none" stroke="#dba43d" stroke-width="5"/><line x1="116" y1="442" x2="134" y2="442" stroke="#bd8b33" stroke-width="2.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="225" y="405" font-size="17" fill="#536158"><tspan x="225" dy="0">Наведи на фигуру.</tspan><tspan x="225" dy="25">Золотая обводка отмечает</tspan><tspan x="225" dy="25">тех, кто её атакует.</tspan><tspan x="225" dy="25">Линии ведут к цели.</tspan></text>
<rect x="495" y="325" width="445" height="245" rx="15" fill="#fffefb" stroke="#e4e3d9"/><text x="517" y="360" font-size="21" font-weight="700" fill="#28352f">Погибнет при расчёте</text><polygon points="629.569219381653,418 629.569219381653,466 588,490 546.430780618347,466 546.430780618347,418 588,394" fill="#eeeee5" stroke="#d8dacb" stroke-width="2"/><g transform="translate(588,442)" opacity="1"><circle r="25" fill="#3e607c" stroke="#fffdf7" stroke-width="3"/><g transform="translate(-12,-13)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 20 5v6c0 5-4 8-8 11-4-3-8-6-8-11V5Z M12 6v11M8 10h8"/></g></g><circle cx="588" cy="442" r="27" fill="none" stroke="#ba5349" stroke-width="3"/><circle cx="565" cy="465" r="14" fill="#fffdf7" stroke="#ba5349" stroke-width="1.5"/><g transform="translate(554,454) scale(1.4)"><path fill="#ba5349" stroke="none" d="M8 1.5c-3.4 0-5.5 2.4-5.5 5.3 0 2 1.2 3.4 2.5 3.9V14h6v-3.3c1.3-.5 2.5-1.9 2.5-3.9C13.5 3.9 11.4 1.5 8 1.5Z"/><circle cx="5.5" cy="6.8" r="1.4" fill="#fffdf7"/><circle cx="10.5" cy="6.8" r="1.4" fill="#fffdf7"/><path d="m8 8.6-1.2 1.8h2.4Z" fill="#fffdf7"/></g><circle cx="611" cy="465" r="12" fill="#fffdf7" stroke="#d8ddcf"/><text x="611" y="470" font-size="17" text-anchor="middle" fill="#28352f" font-weight="700">3</text><text x="662" y="405" font-size="17" fill="#536158"><tspan x="662" dy="0">Череп предупреждает:</tspan><tspan x="662" dy="25">в следующем расчёте урон</tspan><tspan x="662" dy="25">будет больше стойкости.</tspan><tspan x="662" dy="25">Например: 4 > 3.</tspan></text>
<text x="25" y="604" font-size="16" fill="#637064">Подсветка выбора и прогноза исчезает после хода.</text><text x="25" y="628" font-size="16" fill="#637064">Общий просмотр выключается кнопкой или выбором фигуры.</text></svg>