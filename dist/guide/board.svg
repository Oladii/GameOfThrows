<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" font-family="Arial,sans-serif"><title>Дальность и входящие атаки</title><rect width="960" height="420" rx="18" fill="#f5f3ed"/><g fill="#28352f"><text x="30" y="46" font-size="25" font-weight="700">Дальность и входящие атаки</text><rect x="28" y="74" width="440" height="290" rx="14" fill="#fffefb" stroke="#e0e1d6"/><rect x="490" y="74" width="442" height="290" rx="14" fill="#fffefb" stroke="#e0e1d6"/><text x="50" y="108" font-size="19" font-weight="700">Выбранный юнит</text><text x="512" y="108" font-size="19" font-weight="700">Вражеская атака</text><g fill="#e0ebcc" stroke="#b5ca9e"><polygon points="110,160 145,180 145,220 110,240 75,220 75,180"/><polygon points="180,160 215,180 215,220 180,240 145,220 145,180"/><polygon points="250,160 285,180 285,220 250,240 215,220 215,180"/></g><g fill="none" stroke="#3e607c" stroke-width="3"><path d="m169 211 22-22m-12 0h12v12M239 211l22-22m-12 0h12v12"/></g><text x="50" y="286" font-size="16">Мечи или стрелы — клетки атаки.</text><text x="50" y="314" font-size="16">На своих фигурах значков нет.</text><line x1="550" y1="202" x2="875" y2="202" stroke="#b98227" stroke-width="3" stroke-dasharray="6 4"/><path d="m875 202-15-8v16Z" fill="#b98227"/><circle cx="714" cy="202" r="17" fill="#fff9e8" stroke="#b98227"/><text x="714" y="208" text-anchor="middle" font-size="17">2</text><text x="512" y="286" font-size="16">Число на стрелке — урон источника.</text><text x="512" y="314" font-size="16">Наведение показывает прогноз хода.</text></g></svg>