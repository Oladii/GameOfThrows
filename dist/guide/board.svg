<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" font-family="Arial,sans-serif"><title>Дальность и входящие атаки</title><rect width="960" height="420" rx="18" fill="#f5f3ed"/><g fill="#28352f"><text x="30" y="46" font-size="25" font-weight="700">Дальность и входящие атаки</text><rect x="28" y="74" width="440" height="290" rx="14" fill="#fffefb" stroke="#e0e1d6"/><rect x="490" y="74" width="442" height="290" rx="14" fill="#fffefb" stroke="#e0e1d6"/><text x="50" y="108" font-size="19" font-weight="700">Выбранный юнит</text><text x="512" y="108" font-size="19" font-weight="700">Вражеская атака</text><g fill="#f0ede3" stroke="#d9d9cb"><polygon points="110,160 145,180 145,220 110,240 75,220 75,180"/><polygon points="180,160 215,180 215,220 180,240 145,220 145,180"/><polygon points="250,160 285,180 285,220 250,240 215,220 215,180"/></g><circle cx="110" cy="200" r="21" fill="#3e607c" stroke="#fffefb" stroke-width="3"/><path d="M110 185 121 190v12l-11 12-11-12v-12Z" fill="none" stroke="#fffefb" stroke-width="2"/>
<circle cx="250" cy="200" r="21" fill="#af6a4b" stroke="#fffefb" stroke-width="3"/><path d="M250 185 261 190v12l-11 12-11-12v-12Z" fill="none" stroke="#fffefb" stroke-width="2"/>
<polygon points="250,160 285,180 285,220 250,240 215,220 215,180" fill="#3e607c" opacity=".3"/><g transform="translate(180,200) rotate(45)" fill="none" stroke="#3e607c" stroke-width="2.7" opacity=".75" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-6.24,-6.24) scale(.52)"><path d="m5 19 9-9M10 8l6-6 6-1-1 6-6 6M6 12l6 6M3 21l3-3"/></g></g><text x="50" y="286" font-size="16">Меч или стрела — направление атаки.</text><text x="50" y="314" font-size="16">Клетка с врагом подсвечена целиком.</text><text x="50" y="342" font-size="14">На союзниках и исходной клетке меток нет.</text><line x1="550" y1="202" x2="875" y2="202" stroke="#b98227" stroke-width="3" stroke-dasharray="6 4"/><path d="m875 202-15-8v16Z" fill="#b98227"/><circle cx="714" cy="202" r="17" fill="#fff9e8" stroke="#b98227"/><text x="714" y="208" text-anchor="middle" font-size="17">2</text><text x="512" y="286" font-size="16">Число на стрелке — урон источника.</text><text x="512" y="314" font-size="16">Наведение показывает прогноз хода.</text></g></svg>