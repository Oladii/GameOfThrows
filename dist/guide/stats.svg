<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" font-family="Arial,sans-serif"><title>Два показателя на фишке</title><rect width="960" height="420" rx="18" fill="#f5f3ed"/><g fill="#28352f"><text x="30" y="46" font-size="25" font-weight="700">Два показателя на фишке</text><rect x="28" y="74" width="288" height="270" rx="14" fill="#fffefb" stroke="#e0e1d6"/><text x="172" y="108" text-anchor="middle" font-size="17" font-weight="700">Без угроз</text><g transform="translate(172,198) scale(3)"><circle r="21" fill="#3e607c" stroke="#fffdf7" stroke-width="2"/><path d="M0-16 8-13v6c0 5-4 8-8 11-4-3-8-6-8-11v-6Z" fill="none" stroke="white" stroke-width="1.5"/><circle cx="-13" cy="13" r="8.5" fill="#f8edcb" stroke="#b8a16b"/><text x="-13" y="16" text-anchor="middle" font-size="10">4</text><circle cx="13" cy="13" r="8.5" fill="#fffdf7" stroke="#d8ddcf"/><text x="13" y="16" text-anchor="middle" font-size="10">3</text></g><text x="172" y="308" text-anchor="middle" font-size="18">Стойкость 3</text><rect x="336" y="74" width="288" height="270" rx="14" fill="#fffefb" stroke="#e0e1d6"/><text x="480" y="108" text-anchor="middle" font-size="17" font-weight="700">Урон меньше стойкости</text><g transform="translate(480,198) scale(3)"><circle r="21" fill="#3e607c" stroke="#fffdf7" stroke-width="2"/><path d="M0-16 8-13v6c0 5-4 8-8 11-4-3-8-6-8-11v-6Z" fill="none" stroke="white" stroke-width="1.5"/><circle cx="-13" cy="13" r="8.5" fill="#f8edcb" stroke="#b8a16b"/><text x="-13" y="16" text-anchor="middle" font-size="10">4</text><circle cx="13" cy="13" r="8.5" fill="#fffdf7" stroke="#d8ddcf"/><text x="13" y="16" text-anchor="middle" font-size="10">1</text></g><text x="480" y="308" text-anchor="middle" font-size="18">3 − 2 = 1</text><rect x="644" y="74" width="288" height="270" rx="14" fill="#fffefb" stroke="#e0e1d6"/><text x="788" y="108" text-anchor="middle" font-size="17" font-weight="700">Урон равен стойкости</text><g transform="translate(788,198) scale(3)"><circle r="21" fill="#3e607c" stroke="#ba5349" stroke-width="2"/><path d="M0-16 8-13v6c0 5-4 8-8 11-4-3-8-6-8-11v-6Z" fill="none" stroke="white" stroke-width="1.5"/><circle cx="-13" cy="13" r="8.5" fill="#f8edcb" stroke="#b8a16b"/><text x="-13" y="16" text-anchor="middle" font-size="10">4</text><g transform="translate(5,5)"><circle cx="8" cy="8" r="8" fill="#fffdf7" stroke="#ba5349"/><path d="M8 1.5c-3.4 0-5.5 2.4-5.5 5.3 0 2 1.2 3.4 2.5 3.9V14h6v-3.3c1.3-.5 2.5-1.9 2.5-3.9C13.5 3.9 11.4 1.5 8 1.5Z" fill="#ba5349"/><circle cx="5.5" cy="6.8" r="1.4" fill="#fffdf7"/><circle cx="10.5" cy="6.8" r="1.4" fill="#fffdf7"/></g></g><text x="788" y="308" text-anchor="middle" font-size="18">3 − 3 → гибель</text><text x="32" y="383" font-size="17">Снизу слева — сила атаки. Справа — стойкость после угрозы или череп.</text></g></svg>