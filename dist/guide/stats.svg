<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Кружки с параметрами фигуры</title>
  <desc id="desc">У броненосца сверху по центру расположены урон атаки 4 и дальность 1, снизу слева — входящий урон 2, снизу справа — стойкость 3. При входящем уроне 2 фигура выживает. Если входящий урон 4 превышает стойкость 3, вместо нижнего левого кружка появляется череп, а обводка фигуры становится красной.</desc>
  <defs>
    <g id="shield" fill="none" stroke="#fffefb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 20 5v6c0 5-4 8-8 11-4-3-8-6-8-11V5Z"/>
      <path d="M12 6v11M8 10h8"/>
    </g>
    <g id="skull">
      <circle cx="8" cy="8" r="8.5" fill="#fffdf7" stroke="#ba5349" stroke-width="1.2"/>
      <path d="M8 1.5c-3.4 0-5.5 2.4-5.5 5.3 0 2 1.2 3.4 2.5 3.9V14h6v-3.3c1.3-.5 2.5-1.9 2.5-3.9C13.5 3.9 11.4 1.5 8 1.5Z" fill="#ba5349"/>
      <g fill="#fffdf7">
        <circle cx="5.5" cy="6.8" r="1.4"/>
        <circle cx="10.5" cy="6.8" r="1.4"/>
        <path d="m8 8.6-1.2 1.8h2.4Z"/>
      </g>
      <path d="M7 11.5V14m2-2.5V14" fill="none" stroke="#fffdf7" stroke-width=".8"/>
    </g>
  </defs>
  <g font-family="Arial, sans-serif" fill="#28352f">
    <rect x="1" y="1" width="958" height="418" rx="18" fill="#f5f3ed" stroke="#e4e3d9"/>
    <text x="32" y="46" font-size="24" font-weight="700">Что означают кружки у фигуры</text>
    <text x="32" y="75" font-size="16" fill="#7d8278">Параметры показаны прямо на поле — на примере броненосца.</text>

    <rect x="28" y="98" width="582" height="284" rx="14" fill="#fffefb" stroke="#e4e3d9"/>
    <rect x="630" y="98" width="302" height="284" rx="14" fill="#fffefb" stroke="#e4e3d9"/>

    <!-- Callout leaders stop at the badge boundaries. -->
    <g fill="none" stroke="#a5aca1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 143H232L267 164"/>
      <path d="M550 143H390L353 164"/>
      <path d="M54 313H215L236 299"/>
      <path d="M579 313H410L383 296"/>
    </g>
    <g font-size="18" font-weight="700">
      <text x="60" y="130">Урон атаки</text>
      <text x="431" y="130">Дальность</text>
      <text x="54" y="339">Входящий урон</text>
      <text x="463" y="339">Стойкость</text>
    </g>

    <!-- Geometry matches the game token: 21-radius body, upper paired badges,
         incoming damage at (-17,17), and fortitude at (17,17). -->
    <g transform="translate(310 228) scale(3.2)">
      <circle r="21" fill="#3e607c" stroke="#fffdf7" stroke-width="3"/>
      <use href="#shield" transform="translate(-11 -12) scale(.92)"/>
      <circle cx="17" cy="17" r="7.5" fill="#fffdf7" stroke="#d8ddcf" stroke-width="1"/>
      <circle cx="-17" cy="17" r="8.5" fill="#fce1d7" stroke="#c4735c" stroke-width="1.2"/>
      <circle cx="-6.5" cy="-20" r="7.5" fill="#f8edcb" stroke="#b8a16b" stroke-width="1"/>
      <circle cx="6.5" cy="-20" r="7.5" fill="#e5eedf" stroke="#9eaf94" stroke-width="1"/>
      <g text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700">
        <text x="17" y="17.4" fill="#28352f">3</text>
        <text x="-17" y="17.4" fill="#a44232">2</text>
        <text x="-6.5" y="-19.6" fill="#72551e">4</text>
        <text x="6.5" y="-19.6" fill="#435b3c">1</text>
      </g>
    </g>
    <text x="319" y="368" text-anchor="middle" font-size="19" font-weight="700" fill="#55704a">2 ≤ 3 — выживает</text>

    <text x="781" y="129" text-anchor="middle" font-size="18" font-weight="700">Когда урона больше</text>
    <g transform="translate(781 218) scale(2.4)">
      <circle r="21" fill="#3e607c" stroke="#ba5349" stroke-width="4"/>
      <use href="#shield" transform="translate(-11 -12) scale(.92)"/>
      <circle cx="17" cy="17" r="7.5" fill="#fffdf7" stroke="#d8ddcf" stroke-width="1"/>
      <circle cx="-6.5" cy="-20" r="7.5" fill="#f8edcb" stroke="#b8a16b" stroke-width="1"/>
      <circle cx="6.5" cy="-20" r="7.5" fill="#e5eedf" stroke="#9eaf94" stroke-width="1"/>
      <g text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700">
        <text x="17" y="17.4">3</text>
        <text x="-6.5" y="-19.6" fill="#72551e">4</text>
        <text x="6.5" y="-19.6" fill="#435b3c">1</text>
      </g>
      <use href="#skull" transform="translate(-25 9)"/>
    </g>
    <text x="781" y="307" text-anchor="middle" font-size="19" font-weight="700" fill="#ba5349">4 &gt; 3 — погибнет</text>
    <text x="781" y="338" text-anchor="middle" font-size="16">Череп заменяет</text>
    <text x="781" y="360" text-anchor="middle" font-size="16">входящий урон</text>
    <text x="32" y="406" font-size="15" fill="#7d8278">Урон считается заново после каждого хода.</text>
  </g>
</svg>
